name: iOS

# Push'ta imzasız derleme yapılır, Apple hesabı gerekmez.
# TestFlight yüklemesi elle başlatılır: Actions > iOS > Run workflow.
#
# Gerekli secret'lar scripts/ios-imza.ps1 ile hazırlanır:
#   IOS_P12_BASE64, IOS_P12_PASSWORD, IOS_PROFILE_BASE64,
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'ios/**'
      - 'package*.json'
      - 'capacitor.config.ts'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  ios:
    # Capacitor 8, Xcode 26 ister.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run ios

      - name: İmzasız derle
        if: github.event_name == 'push'
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      # Bulut makineleri her çalışmada sıfırlandığı için otomatik imzalama Apple
      # hesabında atık sertifika biriktirir, bu yüzden sabit sertifika kuruluyor.
      - name: Sertifika ve profili kur
        if: github.event_name == 'workflow_dispatch'
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/kok.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/imza.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/kok.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/imza.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          # Yanlış sertifika türü derlemenin sonunda değil, burada görünsün.
          security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Apple Distribution'

          security cms -D -i "$RUNNER_TEMP/kok.mobileprovision" > "$RUNNER_TEMP/profil.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profil.plist")
          echo "KOK_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profil.plist")" >> "$GITHUB_ENV"
          echo "KOK_TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profil.plist")" >> "$GITHUB_ENV"

          # Xcode 16'dan itibaren profiller yeni klasörden okunuyor, eskisi de korunuyor.
          for DIR in \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
            "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$RUNNER_TEMP/kok.mobileprovision" "$DIR/$UUID.mobileprovision"
          done

      - name: Arşivle
        if: github.event_name == 'workflow_dispatch'
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Kok.xcarchive" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: TestFlight'a yükle
        if: github.event_name == 'workflow_dispatch'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$KOK_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.murat.koktakip</key><string>$KOK_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Kok.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
